spring.datasource.url=jdbc:mysql://localhost:3306/acely
spring.datasource.username=root
spring.datasource.password=Root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash

# =========================================================
# JWT
# =========================================================

# For local development.
# For production, put a long random secret in an environment
# variable named JWT_SECRET.
jwt.secret=${JWT_SECRET:AcelyDevelopmentSecretKeyChangeThisToAStrongRandomSecretKey2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174